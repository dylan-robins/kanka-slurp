[project]
name = "kanka-slurp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "html2text>=2025.4.15",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tqdm>=4.68.1",
]

[tool.poetry.dependencies]
# Runtime dependencies for kanka-slurp
requests = "^2.28"
python-dotenv = "^1.0"
tqdm = "^4.0"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
