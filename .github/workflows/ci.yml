name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Run formatter
        run: uv run ruff format --check

      - name: Run linter
        run: uv run ruff check

      - name: Run typechecks
        run: uv run pyright

      - name: Run tests
        run: uv run pytest -q --cov=kanka_slurp --cov-report=term-missing
